<head>

<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071320;color:#eef7ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid #29465d;background:#0b1b2b;display:flex;align-items:center;gap:12px}header strong{font-size:20px}header small{display:block;color:#9eb5ca}main{flex:1;min-height:0;display:flex;flex-direction:column}#launchContent{flex:1;min-height:0;display:flex;flex-direction:column}.notice{max-width:700px;margin:24px auto;padding:22px;border:1px solid #34536b;border-radius:16px;background:#10283a}.notice a{color:#75dfd0}#toast{margin:8px 14px;color:#ffb4b4}.mc-setup{color:#eef7ff}button{cursor:pointer}
</style>

<body>
<header><div aria-hidden="true" style="width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#51dfbd,#6bbdff);display:grid;place-items:center;color:#06131d;font-weight:900">◉</div><div><strong>MetConnect</strong><small>Independent Metxon messaging and calling window · Mettin</small></div></header>
<main><div id="launchContent"><div class="notice">Connecting to your Metxon account…</div></div><div id="toast" role="status"></div></main>
<script>
const SUPABASE_URL='https://brahcvovidgjjzpkxsms.supabase.co';
const SUPABASE_KEY='sb_publishable_FFhWnTcsx3JflSHkIDaSaQ_Mwhh83up';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let profile=null,installed=new Set();
const APPS=[{id:'metconnect',name:'MetConnect',price:5000,desc:'Private username-based messaging and calls.',icon:'◉'}];
function toast(message,type){const e=document.getElementById('toast');if(e){e.textContent=message||'';e.style.color=type==='error'?'#ffaaaa':'#a8c3d8';}}
function renderLocalApp(app,body){const host=document.getElementById('launchContent');if(host)host.innerHTML=body;}
async function getProfile(){const session=await sb.auth.getSession();if(session.error)throw session.error;if(!session.data.session){profile=null;return false;}const q=await sb.from('profiles').select('id,username,display_name,role,balance,jp_balance,created_at').eq('id',session.data.session.user.id).maybeSingle();if(q.error)throw q.error;profile=q.data;return !!profile;}
async function loadStore(){if(!profile)return;const q=await sb.from('metxon_app_installations').select('app_id').eq('user_id',profile.id);if(q.error)throw q.error;installed=new Set((q.data||[]).map(x=>x.app_id));}
async function refreshOverview(){return true;} async function loadMetPay(){return true;}
window.verifyMetAccountCredentials=async function(username,password,expectedUserId){const normalized=String(username||'').trim().toLowerCase();const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normalized));const email='u'+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')+'@metxon.local';const verifier=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});try{const result=await verifier.auth.signInWithPassword({email,password});if(result.error)throw new Error('Metxon username or password is incorrect.');if(result.data?.user?.id!==expectedUserId)throw new Error('Those credentials belong to a different Metxon account.');}finally{try{await verifier.auth.signOut();}catch(e){}}};
async function bootMetConnect(){try{if(!await getProfile()){document.getElementById('launchContent').innerHTML='<section class="notice"><h2>Sign in required</h2><p>Sign in to your Metxon account on this website, then reopen this separate MetConnect window.</p><p><a href="./">Return to Mettin</a></p></section>';return;}await loadStore();await window.launchMetConnectApp();}catch(e){document.getElementById('launchContent').innerHTML='<section class="notice"><h2>Could not open MetConnect</h2><p>'+String(e.message||e)+'</p><button onclick="location.reload()">Retry</button></section>';}}
document.addEventListener('DOMContentLoaded',bootMetConnect);
</script>
<script src="./metconnect.js?v=20261109-stable-remote-audio-7"></script>
</body></html>
